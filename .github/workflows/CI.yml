name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          # Project.toml declares julia = "1.12", so the current LTS (1.10)
          # cannot resolve. Pin the declared minimum instead of 'lts'.
          - '1.12'
          - '1'
          - 'nightly'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
        exclude:
          # macOS-latest runners are Apple Silicon (arm64); x64 is not available
          - os: macOS-latest
            arch: x64
        include:
          - os: macOS-latest
            arch: aarch64
            version: '1.12'
          - os: macOS-latest
            arch: aarch64
            version: '1'
          - os: macOS-latest
            arch: aarch64
            version: 'nightly'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Authenticate to private ManyUI.jl
        # ManyUI.jl is a PRIVATE repo. This job's default GITHUB_TOKEN is
        # scoped to ManyUIWeb.jl only and cannot read it, so the dev step
        # below would fail on an unauthenticated clone. Rewrite github.com
        # URLs to carry a read-only PAT instead.
        #
        # Requires repo secret DUALUI_READ_TOKEN: a fine-grained PAT with
        # Contents: Read-only on s-celles/ManyUI.jl. Delete this step once
        # ManyUI.jl is public or in the General registry.
        env:
          DUALUI_READ_TOKEN: ${{ secrets.DUALUI_READ_TOKEN }}
        shell: bash
        run: |
          if [ -z "$DUALUI_READ_TOKEN" ]; then
            echo "::error::Secret DUALUI_READ_TOKEN is not set. ManyUI.jl is private and cannot be cloned without it."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${DUALUI_READ_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - name: Dev unregistered dependencies
        env:
          # Pkg clones through LibGit2 by default, and LibGit2 does NOT
          # honour the url.insteadOf rewrite configured above -- it would
          # go to github.com unauthenticated and fail on the private repo.
          # This makes Pkg shell out to the git CLI, which does honour it.
          JULIA_PKG_USE_CLI_GIT: 'true'
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          # Manifest.toml is not committed, and the manifest is the only
          # place the ManyUI dep is resolved (`path = "../ManyUI"`, a
          # sibling checkout that does not exist on a runner). ManyUI is
          # unregistered, so without this step `instantiate` cannot find it
          # at all and buildpkg fails.
          #
          # Remove this step once ManyUI is in the General registry.
          Pkg.develop([
              PackageSpec(url="https://github.com/s-celles/ManyUI.jl")
          ])
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
