name: Documentation
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write
      # `read`, not `write`: this job deliberately does NOT publish to
      # GitHub Pages. See "To enable publishing" on the build step below --
      # bumping this to `write` is part of turning it on.
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Authenticate to private ManyUI.jl
        # See the identical step in CI.yml. ManyUI.jl is private and this
        # job's GITHUB_TOKEN cannot read it; the doc environment devs it by
        # URL, so the clone needs a read-only PAT.
        #
        # Requires repo secret DUALUI_READ_TOKEN: a fine-grained PAT with
        # Contents: Read-only on s-celles/ManyUI.jl. Delete this step once
        # ManyUI.jl is public or in the General registry.
        env:
          DUALUI_READ_TOKEN: ${{ secrets.DUALUI_READ_TOKEN }}
        shell: bash
        run: |
          if [ -z "$DUALUI_READ_TOKEN" ]; then
            echo "::error::Secret DUALUI_READ_TOKEN is not set. ManyUI.jl is private and cannot be cloned without it."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${DUALUI_READ_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - name: Configure doc environment
        env:
          # Pkg clones through LibGit2 by default, and LibGit2 does NOT
          # honour the url.insteadOf rewrite configured above -- it would
          # go to github.com unauthenticated and fail on the private repo.
          # This makes Pkg shell out to the git CLI, which does honour it.
          JULIA_PKG_USE_CLI_GIT: 'true'
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          # docs/Manifest.toml is not committed, so both path deps
          # (`path = ".."` for ManyUIWeb, `path = "../../ManyUI"` for the
          # unregistered ManyUI) have to be re-established here. Develop
          # them in ONE call so Pkg resolves the pair together -- devving
          # them one at a time makes the first resolve against a registry
          # that has no ManyUI in it.
          #
          # Remove the URL entry once ManyUI is in the General registry.
          Pkg.develop([
              PackageSpec(path=pwd()),
              PackageSpec(url="https://github.com/s-celles/ManyUI.jl")
          ])
          Pkg.instantiate()
      - name: Build documentation
        # Build only -- nothing is published. docs/make.jl has no
        # deploydocs() call, and no GITHUB_TOKEN / DOCUMENTER_KEY is wired
        # in, so this cannot reach GitHub Pages. It still earns its place:
        # make.jl sets `warnonly = false`, so any docs warning fails the job.
        #
        # To enable publishing later:
        #   1. append deploydocs(repo = "github.com/s-celles/ManyUIWeb.jl")
        #      to docs/make.jl, and drop the `remotes = nothing` /
        #      `repolink = nothing` / `edit_link = nothing` overrides, which
        #      are only there because there is no git remote yet;
        #   2. change `contents:` above to `write`;
        #   3. add to this step:
        #        env:
        #          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        #          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs --color=yes -e 'include("docs/make.jl")'
